<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Darování tučňákovi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1/dist/es-module-shims.min.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body text-center">
                        <h1 class="card-title mb-4">Podpořte naše tučňáky</h1>
                        <img src="/assets/penguin.jpg" class="img-fluid rounded mb-4" alt="Tučňák" style="max-height: 300px;">
                        <p class="lead mb-4">Celkem vybráno: {{ total_amount }} Kč</p>
                        
                        {% if comments %}
                        <div class="mb-4">
                            <h3>Poslední příspěvky:</h3>
                            <ul class="list-group">
                                {% for comment in comments %}
                                <li class="list-group-item">
                                    {% if comment.name %}
                                    <strong>{{ comment.name }}:</strong>
                                    {% endif %}
                                    {{ comment.comment }}
                                </li>
                                {% endfor %}
                            </ul>
                        </div>
                        {% endif %}
                        
                        <form action="/donate" method="POST">
                            <div class="mb-3">
                                <label for="amount" class="form-label">Částka (v Kč)</label>
                                <input type="number" class="form-control" id="amount" name="amount" placeholder="Zadejte částku" required>
                            </div>
                            <div class="mb-3">
                                <label for="name" class="form-label">Vaše jméno (volitelné)</label>
                                <input type="text" class="form-control" id="name" name="name" placeholder="Vaše jméno">
                            </div>
                            <div class="mb-3">
                                <label for="comments" class="form-label">Poznámka (volitelná)</label>
                                <textarea class="form-control" id="comments" name="comments" rows="3" placeholder="Vaše poznámka"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Odeslat dar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
